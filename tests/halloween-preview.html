<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WRC Halloween · sichere Vorschau</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../modules/holidays/holidays.css"><link rel="stylesheet" href="../modules/holidays/halloween.css"><style>body{margin:0;padding:22px;background:#0b1017;color:#eee;font-family:system-ui}main{max-width:900px;margin:auto}.test-controls{padding:16px;background:#202735;border-radius:12px;margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:end}.test-controls label{font-size:12px;display:grid;gap:6px}.test-controls select,.test-controls input,.test-controls button{font:inherit;min-height:42px;padding:8px}.test-controls p{width:100%;margin:0;font-size:12px}.wh-card{margin:0!important}</style></head><body><main><h1>🎃 Die vier verfluchten Türen</h1><div class="test-controls"><p>Nur lokale Vorschau. Kein Supabase-Zugriff, keine echten Punkte. Die Auswahl erzwingt ausschließlich das nächste lokale Testereignis.</p><label>Spieler<select id="testPlayer"><option>Thorsten</option><option>Basti</option><option>Fabi</option><option>Marian</option></select></label><label>Jahr<input id="testYear" type="number" min="2026" max="9999" value="2026"></label><label>Nächste Tür<select id="testEvent"><option value="continue">Vier weitere Türen</option><option value="scare">Wursti-Jumpscare</option><option value="gold">Goldwurst</option><option value="curse">Absurder Fluch</option><option value="random">Zufall 45/25/20/10</option></select></label><button id="testReset">Lokale Testakten zurücksetzen</button></div><section id="labyrinth"></section><div id="entriesList"></div></main><script src="../config.js"></script><script>window.WRC_HALLOWEEN_FIXTURE={next:'continue'};window.WRCHolidayData={preview:true,today:()=>document.getElementById('testYear').value+'-10-31'};window.supabaseClient={from(){throw Error('Keine Datenbank in der Vorschau')},rpc(){throw Error('Keine Punkte in der Vorschau')}};</script><script src="../modules/holidays/halloween-core.js"></script><script src="../modules/holidays/halloween-data.js"></script><script src="../modules/holidays/halloween.js"></script><script>
if(!['localhost','127.0.0.1'].includes(location.hostname)){document.querySelector('main').textContent='Diese Testansicht ist ausschließlich lokal verfügbar.';}else{
const render=async()=>{await WRCHalloweenData.load();WRCHalloween.render(document.getElementById('labyrinth'),document.getElementById('testPlayer').value,+document.getElementById('testYear').value);WRCHalloween.archive();};
window.renderAll=render;
document.getElementById('testPlayer').addEventListener('change',render);document.getElementById('testYear').addEventListener('change',render);document.getElementById('testEvent').addEventListener('change',e=>{WRC_HALLOWEEN_FIXTURE.next=e.target.value;});document.getElementById('testReset').addEventListener('click',()=>{localStorage.removeItem('wrcHalloweenPreview_v2');render();});render();}
</script></body></html>
