    function cleanLoadedEntries(rawEntries) {
      const mergedMap = {};

      rawEntries.forEach(e => {
        const key = `${e.date}_${e.person}`;

        if (!mergedMap[key]) {
          mergedMap[key] = { ...e };
          return;
        }

        const existing = mergedMap[key];

        existing.steps = Math.max(+existing.steps || 0, +e.steps || 0);
        existing.bike = Math.max(+existing.bike || 0, +e.bike || 0);
        existing.squats = Math.max(+existing.squats || 0, +e.squats || 0);
        existing.pushups = Math.max(+existing.pushups || 0, +e.pushups || 0);
        existing.exercise = existing.exercise || e.exercise;
      });

      return Object.values(mergedMap);
    }


const core=WRCDashboardStoryCore,day='2026-10-28',through=core.shift(day,-1);
function render(mode='story'){
const entries=mode==='empty'?[]:people.flatMap(person=>Array.from({length:27},(_,i)=>({person,date:core.shift('2026-10-01',i),steps:6000,bike:mode==='record'&&i===26?80:3,squats:15})));
const fact=core.build({day,entries,players:people,score:calcPoints,clean:cleanLoadedEntries,special:mode==='special'}),card=document.getElementById('dashboardHighlight');card.hidden=!fact;card.classList.toggle('is-record',fact?.kind==='record');if(fact){document.getElementById('dashboardHighlightKicker').textContent=fact.kicker;document.getElementById('dashboardHighlightTitle').textContent=fact.label;document.getElementById('dashboardHighlightText').textContent=fact.text;}
for(const [id,text] of Object.entries({monthTitle:'Oktober 2026 · Gemeinsam unterwegs',goalTarget:'1.700',barPercentTop:'76 %',barText:'1.292 / 1.700 Punkte',goalPaceTeam:'102 Punkte',goalPacePlayer:'25,5 Punkte',goalForecast:'1.780 Punkte',goalForecastBasis:'Vollständig bis 27.10.2026',dashboardAchievementTitle:'Der nächste gemeinsame Meilenstein',dashboardAchievementProgress:'Euer Fortschritt bleibt hier unverändert.'})) {const el=document.getElementById(id);if(el)el.textContent=text;}document.getElementById('barFill').style.width='76%';
}
if(['localhost','127.0.0.1'].includes(location.hostname)){document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.mode)));render();}else{document.querySelector('main').textContent='Nur lokal verfügbar.';}
</script></body></html>
