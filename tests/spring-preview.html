<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>WRC · sichere Frühlingsvorschau</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="modules/holidays/holidays.css"><link rel="stylesheet" href="modules/holidays/spring.css"><link rel="stylesheet" href="modules/seasonal/seasonal.css"><style>.ws-preview-controls{max-width:1000px;margin:18px auto;padding:16px;background:#203c3a;color:#f7efd9;border:1px solid #859b8e;border-radius:14px;font:13px system-ui;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.ws-preview-controls p{width:100%;margin:0}.ws-preview-controls button,.ws-preview-controls select,.ws-preview-controls input{min-height:44px;font:inherit}.ws-preview-controls a{color:#d3e6ad}#fixtureMount .wrap{margin:auto}.panel{display:none}.panel.active{display:block}</style></head><body><div class="ws-preview-controls"><p>Lokale Vorschau · keine Produktionsverbindung, keine echten Punkte. Die Auswahl verrät keine Verstecke.</p><a href="tests/spring-preview.html?holiday=2027-02-08">Rosenmontag 2027</a><a href="tests/spring-preview.html?holiday=2028-02-28">Rosenmontag 2028</a><a href="tests/spring-preview.html?holiday=2027-03-28">Ostern 2027</a><label>Datum <input id="previewDate" type="date"></label><button id="previewGo">Datum anzeigen</button><label>Spieler <select id="previewPerson"><option>Thorsten</option><option>Fabi</option><option>Marian</option><option>Basti</option></select></label><button id="previewReset">Nur lokale Teststände zurücksetzen</button><span id="previewPoints" role="status"></span></div><main id="fixtureMount"></main><script>
(async()=>{
 if(!['localhost','127.0.0.1'].includes(location.hostname)){document.body.textContent='Vorschau nur lokal verfügbar.';return;}
 if(!new URLSearchParams(location.search).has('holiday')){location.replace('tests/spring-preview.html?holiday=2027-02-08');return;}
 const html=await(await fetch('index.html')).text(),source=new DOMParser().parseFromString(html,'text/html');source.querySelectorAll('script').forEach(n=>n.remove());
 const mount=document.getElementById('fixtureMount');for(const node of [...source.body.children])mount.append(document.importNode(node,true));
 window.showTab=(id)=>{document.querySelectorAll('.panel').forEach(n=>n.classList.toggle('active',n.id===id));window.scrollTo(0,0);};window.toggleMainMenu=()=>{document.getElementById('mainMenu')?.classList.toggle('open');};window.toggleGameLoungeMenu=()=>{document.getElementById('gameLoungeSubmenu')?.classList.toggle('open');};window.toggleMoreMenu=()=>{document.getElementById('moreSubmenu')?.classList.toggle('open');};window.navigateBannerHome=()=>showTab('dashboard');
 window.supabaseClient={from(){throw Error('No production access in preview')},rpc(){throw Error('No production writes in preview')}};window.WRCHalloween={archive(){}};window.WRCHalloweenData={load:async()=>{}};window.WRCChristmasSeason={renderAdvent(){}};window.allEntries=[];window.selectedMonth=()=>WRCHolidayData.today().slice(0,7);
 const load=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.append(s);});
 for(const src of ['config.js','scoring.js','modules/insights/insights.js','modules/holidays/holiday-calendar.js','modules/birthday/member-birthday-data.js','modules/holidays/holiday-data.js','modules/holidays/spring-core.js','modules/holidays/spring-data.js','modules/holidays/spring-insights.js','modules/holidays/spring-art.js','modules/holidays/spring-locations.js','modules/holidays/spring-ui.js','modules/holidays/holidays.js'])await load(src);
 window.renderAll=()=>{WRCHolidays.render();document.getElementById('previewPoints').textContent='Testpunkte: '+WRCBonusPoints.points({person:document.getElementById('previewPerson').value});};
 document.getElementById('previewDate').value=WRCHolidayData.today();document.getElementById('previewGo').onclick=()=>{const u=new URL(location.href);u.searchParams.set('holiday',document.getElementById('previewDate').value);location.href=u.href;};document.getElementById('previewPerson').onchange=e=>{const select=document.getElementById('person');select.value=e.target.value;select.dispatchEvent(new Event('change'));renderAll();};document.getElementById('previewReset').onclick=()=>{for(const key of Object.keys(localStorage))if(key==='wrcEasterPreview_v2'||key.startsWith('wrcCarnivalPreview:'))localStorage.removeItem(key);location.reload();};
 document.getElementById('person').innerHTML=WRCSpringCore.members.map(p=>'<option>'+p+'</option>').join('');
 document.getElementById('person').value=WRCHolidayCalendar.previewPlayer||'Thorsten';document.getElementById('previewPerson').value=document.getElementById('person').value;
 // Install handlers after async fixture loading; do not execute the app's real data services.
 document.dispatchEvent(new Event('DOMContentLoaded'));showTab('dashboard');await WRCBonusPoints.load();renderAll();document.documentElement.dataset.springReady='true';
})();
</script></body></html>
