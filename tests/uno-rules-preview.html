<!doctype html><html lang="de"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO · lokale Funktionsprüfung</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../modules/uno/uno.css"><link rel="stylesheet" href="../modules/uno/uno-rules.css"><style>body{padding:16px;max-width:1100px;margin:auto}#saveProof{display:block;padding:12px;background:#172c42;color:white;border-radius:10px;margin:12px 0}.game-mascot{display:none}</style></head><body><output id="saveProof">Lokaler Test · keine Produktivdaten</output><div id="unoPanel" class="panel active"></div><script>
'use strict';
if (!['127.0.0.1','localhost'].includes(location.hostname)) throw new Error('Nur lokal verwenden.');
const escapeHtml = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mockGames = [];
let pendingGame;
const supabaseClient = {from(table) {
  const query = {select(){return query},order(){return query},
    insert(rows) { if(table==='uno_games') pendingGame={id:'local-test-round',...rows,created_at:new Date().toISOString()};
      else {mockGames.unshift({...pendingGame,uno_results:rows});document.getElementById('saveProof').textContent='PASS · Gespeichert: '+rows.map(r=>r.place+'. '+r.player).join(' · ');}
      return query;},
    single(){return Promise.resolve({data:pendingGame,error:null})},
    then(resolve,reject){return Promise.resolve({data:mockGames,error:null}).then(resolve,reject)}
  };return query;
}};
</script><script src="../modules/uno/uno.js"></script><script src="../modules/uno/uno-rules-data.js"></script><script>if (new URLSearchParams(location.search).has("broken-image")) WRCUnoRules.images["flip-dark-draw5"] = "missing-test-photo.png";</script><script src="../modules/uno/uno-rules.js"></script></body></html>
