<!doctype html><html lang="de"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B.o.B. · lokale Prüfung</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../modules/bob/bob.css"><style>body{padding:16px}.bob-test-controls{max-width:1180px;margin:10px auto 20px;color:#cbd5e1;font-size:12px}.bob-test-controls button{margin:6px;padding:10px}</style></head><body><div class="bob-test-controls"><p>LOKALE TESTUMGEBUNG · leere temporäre Datenbank · keine echten Personen oder Produktionsdaten</p><button data-fault="upload">Nächsten Upload unterbrechen</button><button data-fault="save">Nächste Speicherantwort verlieren</button><button data-fault="remove">Nächste Bildlöschung unterbrechen</button></div><section id="funfactsPanel" class="panel active"><button class="bob-entry" id="previewEntry"><span class="bob-entry-icon">🥸</span><span><strong>B.o.B. – Best of Bärte</strong><small>Das Museum der fragwürdigen Gesichtskunst</small></span><span class="bob-entry-arrow">→</span></button><h3>Bisherige Fun Facts bleiben hier.</h3></section><section id="bobPanel" class="panel"></section><script>
if(!['localhost','127.0.0.1'].includes(location.hostname)){document.body.textContent='Nur lokal verfügbar.';throw Error('Local fixture only');}
const request=async(url,options)=>{try{const r=await fetch(url,options),data=await r.json();return r.ok?{data,error:null}:{data:null,error:data};}catch(e){return {data:null,error:e};}};
const supabaseClient={rpc:(name,args)=>request('/__bob/rpc/'+name,{method:'POST',body:JSON.stringify(args||{})}),from:()=>({select:()=>({order:()=>({range:(a,b)=>request('/__bob/exhibits?offset='+a+'&limit='+(b-a+1))})})}),storage:{from:()=>({getPublicUrl:path=>({data:{publicUrl:'/__bob/files/'+encodeURIComponent(path)}}),upload:(path,file,options)=>request('/__bob/files/'+encodeURIComponent(path),{method:'POST',headers:{'Content-Type':options.contentType},body:file}),remove:paths=>request('/__bob/remove',{method:'POST',body:JSON.stringify(paths)})})}};
function menuLinkForPanel(){return null;}function showTab(id){document.querySelectorAll('.panel').forEach(p=>{p.classList.toggle('active',p.id===id);p.style.display=p.id===id?'block':'none';});if(id==='bobPanel')WRCBob.open();else WRCBob.close();}
document.getElementById('previewEntry').onclick=()=>showTab('bobPanel');document.querySelectorAll('[data-fault]').forEach(b=>b.onclick=()=>request('/__bob/fault',{method:'POST',body:JSON.stringify({[b.dataset.fault]:true})}));
</script><script src="../modules/bob/bob-core.js"></script><script src="../modules/bob/bob-data.js"></script><script src="../modules/bob/bob-crop.js"></script><script src="../modules/bob/bob.js"></script></body></html>
